# --------------------------------------------------------------------------------------------
# Global false-positive control for the built-in credential rules
# --------------------------------------------------------------------------------------------
[[global_allowlists]]
description = "builtin: documentation placeholders"
regexes = ['''(?i)^(?:x{6,}|\*{4,}|<[^>]+>|\$\{[^}]+\}|\{\{[^}]+\}\})$''']

# --------------------------------------------------------------------------------------------
# Policies
# --------------------------------------------------------------------------------------------
[[policies]]
id = "default"
name = "Balanced (mask contact data, anonymize names, redact credentials, block private keys)"
fail_mode = "fail_closed"
enabled_detectors = ["regex", "secret", "dictionary", "presidio"]
mandatory_detectors = ["secret", "regex"]
default_action = "AUDIT"
min_confidence = 0.4
stream_mode = "strict"
nlp_trigger = "always"
unmodifiable_action = "drop"
rules = [
  { match_kind = "entity_type", match_value = "PRIVATE_KEY", action = "REDACT" },
  { match_kind = "category", match_value = "credential", action = "REDACT" },
  { match_kind = "entity_type", match_value = "DB_CONNECTION_STRING", action = "REDACT" },
  { match_kind = "entity_type", match_value = "PHONE_NUMBER", action = "MASK" },
  { match_kind = "entity_type", match_value = "EMAIL_ADDRESS", action = "MASK" },
  { match_kind = "entity_type", match_value = "PERSON", action = "ANONYMIZE", min_confidence = 0.6 },
  { match_kind = "entity_type", match_value = "CN_ID_CARD", action = "REDACT" },
  { match_kind = "entity_type", match_value = "PASSPORT", action = "REDACT" },
  { match_kind = "entity_type", match_value = "BANK_CARD", action = "REDACT" },
  { match_kind = "entity_type", match_value = "CREDIT_CARD", action = "REDACT" },
  { match_kind = "entity_type", match_value = "BANK_ACCOUNT", action = "REDACT" },
  { match_kind = "entity_type", match_value = "ADDRESS", action = "MASK", min_confidence = 0.6 },
  { match_kind = "entity_type", match_value = "LOCATION", action = "AUDIT" },
  { match_kind = "entity_type", match_value = "IP_INTERNAL", action = "AUDIT" },
  { match_kind = "entity_type", match_value = "IP_PUBLIC", action = "PASS" },
  { match_kind = "entity_type", match_value = "INTERNAL_DOMAIN", action = "REDACT" },
  { match_kind = "category", match_value = "internal", action = "REDACT" },
  { match_kind = "entity_type", match_value = "FINANCIAL_AMOUNT", action = "AUDIT" },
]

[[policies]]
id = "reversible"
name = "Reversible anonymization of PII (round trip with Token Vault); credentials stay irreversible"
fail_mode = "fail_closed"
enabled_detectors = ["regex", "secret", "dictionary", "presidio"]
mandatory_detectors = ["secret", "regex"]
default_action = "AUDIT"
min_confidence = 0.4
stream_mode = "strict"
nlp_trigger = "always"
unmodifiable_action = "drop"
rules = [
  { match_kind = "entity_type", match_value = "PRIVATE_KEY", action = "REDACT" },
  { match_kind = "category", match_value = "credential", action = "REDACT" },
  { match_kind = "entity_type", match_value = "DB_CONNECTION_STRING", action = "REDACT" },
  { match_kind = "category", match_value = "pii", action = "ANONYMIZE", min_confidence = 0.6 },
  { match_kind = "category", match_value = "contact", action = "ANONYMIZE", min_confidence = 0.6 },
  { match_kind = "entity_type", match_value = "PERSON", action = "ANONYMIZE", min_confidence = 0.6 },
  { match_kind = "entity_type", match_value = "CN_ID_CARD", action = "REDACT" },
  { match_kind = "entity_type", match_value = "PASSPORT", action = "REDACT" },
  { match_kind = "category", match_value = "financial", action = "REDACT" },
  { match_kind = "category", match_value = "internal", action = "REDACT" },
  { match_kind = "entity_type", match_value = "IP_PUBLIC", action = "PASS" },
  { match_kind = "entity_type", match_value = "IP_INTERNAL", action = "AUDIT" },
  # model output: do not let the model mint new PII or secrets; placeholders are restored separately
  { match_kind = "category", match_value = "pii", direction = "response", action = "MASK" },
  { match_kind = "category", match_value = "contact", direction = "response", action = "MASK" },
]

[[policies]]
id = "strict"
name = "Strict gateway policy: everything sensitive is redacted or blocks; the Presidio recognizer service is mandatory"
fail_mode = "fail_closed"
enabled_detectors = ["regex", "secret", "dictionary", "presidio"]
mandatory_detectors = ["secret", "regex", "presidio"]
default_action = "REDACT"
min_confidence = 0.5
stream_mode = "strict"
