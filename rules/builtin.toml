# Opt-in: refuse instead of sanitize. Desensitization is the default behaviour of every other policy.
[[policies]]
id = "block-secrets"
name = "Opt-in blocking policy: private keys and credentials stop the request (everything else is sanitized)"
fail_mode = "fail_closed"
enabled_detectors = ["regex", "secret", "dictionary"]
mandatory_detectors = ["secret", "regex"]
default_action = "AUDIT"
min_confidence = 0.4
stream_mode = "strict"
nlp_trigger = "always"
unmodifiable_action = "block"
rules = [
  { match_kind = "entity_type", match_value = "PRIVATE_KEY", action = "BLOCK" },
  { match_kind = "category", match_value = "credential", action = "BLOCK" },
  { match_kind = "entity_type", match_value = "PHONE_NUMBER", action = "MASK" },
  { match_kind = "entity_type", match_value = "EMAIL_ADDRESS", action = "MASK" },
  { match_kind = "entity_type", match_value = "CN_ID_CARD", action = "REDACT" },
]
